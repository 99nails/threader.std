; Параметры работы с GPS
[GPS]
; Порт подключения к GPS
Port=COM3
;Port=/dev/pts/3

; Параметры эмуляции GPS
[GPS.Emulator]
; Широта
Latitude=59,9386
; Долгота
Longitude=30,3141
; Период отправки данных в секундах
Period=2
; Порт для отправки  данных
Port=COM4
;Port=/dev/pts/0

; Праметры подключения к серверу времени
[Server]
; Время в секундах ожидания активности на подключении, при превышении которого подключение закрывается
AliveTimeout=30
; Имя хоста или IP адрес, к которому подключается клиент
Host=localhost
; TCP порт, на который принимаются подключения
Port=56438
; Задержка повтроного подключения при ошибке соединения в секундах
ReconnectTimeout=10
